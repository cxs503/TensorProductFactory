name: English Exam Benchmark Validation

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "benchmarks/english-exam-coach/**"
      - "tools/validate_english_benchmark.py"
      - "tests/test_english_benchmark.py"
      - ".github/workflows/english-benchmark.yml"
  pull_request:
    branches: [main]
    paths:
      - "benchmarks/english-exam-coach/**"
      - "tools/validate_english_benchmark.py"
      - "tests/test_english_benchmark.py"
      - ".github/workflows/english-benchmark.yml"

jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate benchmark structure
        run: python tools/validate_english_benchmark.py benchmarks/english-exam-coach/fixtures/reading-original-v0.1.json
      - name: Test release gates and invalid fixtures
        run: python -m pip install pytest && python -m pytest -q tests/test_english_benchmark.py

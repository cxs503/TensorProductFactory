[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorproductfactory"
version = "0.1.0"
description = "Product lifecycle and quality gate for agent-produced digital goods"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Tensor contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.23"]

[tool.setuptools.packages.find]
include = ["product_factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
